<!doctype html>
<html lang="es">
  <!-- ===================================================== -->
  <!--  HEAD - Metadatos, título y conexión con el CSS -->
  <!-- ===================================================== -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/iniciar_sesion.css" />
  </head>

  <body>
    <!-- ===================================================== -->
    <!--  HEADER - Navegación - Logo -->
    <!-- ===================================================== -->
    <header>
      <!--  Barra de navegación superior -->
      <nav class="top-nav">
        <a href="busqueda_recetas.html">Buscar</a>
        <a href="iniciar_sesion.html">Iniciar sesión</a>
        <a href="mealab.html">Registrarse</a>
      </nav>

      <!--  Contenedor del saludo y el logo -->
      <div class="contenedor_saludo_y_logo">
        <h1 class="saludo_a_usuario">Bienvenidos</h1>

        <img
          src="../assets/logo_transparente.png"
          alt="MeaLab Logo Oficial"
          class="logo"
        />
      </div>
    </header>

    <!-- ===================================================== -->
    <!--  MAIN - Contenido principal de la página -->
    <!-- ===================================================== -->
    <main>
      <!--  Contenedor principal -->
      <!-- Contiene: imagen + formulario de inicio de sesión -->

      <div class="contenedor_principal">
        <!--  Imagen de la sección de inicio de sesión -->

        <div class="contenedor_imagen_iniciar_sesion">
          <img src="../assets/img_iniciar_sesion.jpg" alt="" />
        </div>

        <!-- ===================================================== -->
        <!--  Formulario de inicio de sesión -->
        <!-- ===================================================== -->
        <div class="contenedor_formulario_iniciar_sesion">
          <div class="formulario_iniciar_sesion">
            <!--  Botones para cambiar entre registro e inicio de sesión -->
            <div class="contenedor_botones_registro">
              <button class="boton_iniciar_sesion">Iniciar Sesión</button>
              <button class="boton_registro">Registrarse</button>
            </div>

            <!-- ===================================================== -->
            <!--  Campos del formulario de inicio de sesión -->
            <!-- ===================================================== -->
            <div class="formulario">
              <form id="form_login">
                <!-- Campo: Email -->
                <div class="campo_formulario">
                  <label>Email</label>
                  <input type="text" id="email"/>
                </div>

                <!-- Campo: Contraseña -->
                <div class="campo_formulario">
                  <label>Contraseña</label>
                  <input type="password" id="password" />
                </div>
              </form>
            </div>

            <!-- ===================================================== -->
            <!-- Botón de crear cuenta -->
            <!-- ===================================================== -->
            <div class="contenedor_boton_iniciar_sesion">
              <button class="boton_iniciar_sesion" id="boton_login">Iniciar</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- ===================================================== -->
    <!--  FOOTER - Información legal -->
    <!-- ===================================================== -->
    <footer class="footer">
      <p>&copy; 2026 MeaLab. Todos los derechos reservados.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/iniciar_sesion.js"></script>
    <script src="../js/busqueda_recetas.js"></script>
    
  </body>
</html>
